name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Cache the locally-built golangci-lint binary across runs. The
      # Makefile's golangci-lint target builds a *custom* binary with the
      # logcheck module plugin baked in (per .custom-gcl.yml), which the
      # stock golangci-lint-action does not — using that action here would
      # fail with "plugin logcheck not found" the moment .golangci.yml
      # enables it.
      - name: Cache golangci-lint binary
        uses: actions/cache@v4
        with:
          path: bin/
          key: ${{ runner.os }}-golangci-${{ hashFiles('.custom-gcl.yml', '.golangci.yml', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-golangci-

      - name: Run linter
        run: make lint
